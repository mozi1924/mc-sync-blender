modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
description='''${description}'''
authors="${mod_author}"
iconFile="assets/yefira/icon.png"

[[mixins]]
config = "yefira.mixins.json"

[[mixins]]
config = "yefira.client.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
type="required"
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"


plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'maven-publish'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    group = project.group
    version = project.version

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = "UTF-8"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        withSourcesJar()
    }
}

tasks.register('runFabricClient') {
    group = 'minecraft'
    description = 'Runs the Minecraft Fabric Client'
    dependsOn ':fabric:runClient'
}

tasks.register('runNeoForgeClient') {
    group = 'minecraft'
    description = 'Runs the Minecraft NeoForge Client'
    dependsOn ':neoforge:runClient'
}

tasks.register('runFabricServer') {
    group = 'minecraft'
    description = 'Runs the Minecraft Fabric Dedicated Server'
    dependsOn ':fabric:runServer'
}

tasks.register('runNeoForgeServer') {
    group = 'minecraft'
    description = 'Runs the Minecraft NeoForge Dedicated Server'
    dependsOn ':neoforge:runServer'
}


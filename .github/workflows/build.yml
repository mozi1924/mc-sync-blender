name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: determine java version
        id: java-config
        run: |
          REQ_JAVA=$(grep "^java_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "version=${REQ_JAVA:-21}" >> $GITHUB_OUTPUT
          if [ "$REQ_JAVA" = "25" ]; then
            echo "distribution=microsoft" >> $GITHUB_OUTPUT
          else
            echo "distribution=temurin" >> $GITHUB_OUTPUT
          fi

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java-config.outputs.version }}
          distribution: ${{ steps.java-config.outputs.distribution }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: stage executable mod jars
        run: |
          mkdir -p build/dist-mods
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name "yefira-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp -v {} build/dist-mods/ \;
          ls -lh build/dist-mods/

      - name: upload executable mod jars
        uses: actions/upload-artifact@v4
        with:
          name: Yefira-Mod-Jars-${{ github.ref_name }}
          path: build/dist-mods/*.jar

      - name: upload sources and javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yefira-Sources-Javadoc-${{ github.ref_name }}
          path: |
            common/build/libs/*-sources.jar
            common/build/libs/*-javadoc.jar
            fabric/build/libs/*-sources.jar
            fabric/build/libs/*-javadoc.jar
            neoforge/build/libs/*-sources.jar
            neoforge/build/libs/*-javadoc.jar
